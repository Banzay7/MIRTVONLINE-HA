configuration:
  language:
    name: Notification and script language
    description: >-
      Home Assistant notifications, names and voice phrases of the scripts the "Create
      in Home Assistant" button makes. The site, its events and job summaries included,
      uses the language picked in the browser: site → Settings → Interface language.
  profile:
    name: Data profile
    description: >-
      How many streams to take from found playlists. S: up to 6,000, fine for a 4 GB
      box (HA Green). M: up to 15,000, Raspberry Pi 5 or a mini PC. L: up to 30,000 and
      8 checks at once instead of 4, mini PC only. Your own playlists don't count.
  home_country:
    name: Home country
    description: >-
      Two-letter country code, e.g. de. Channels of this country come first at the
      profile's limit and get into the catalog even if they look geo-blocked from the
      server. Empty: no such exceptions.
  channel_languages:
    name: Channel languages
    description: >-
      Language codes separated by commas, e.g. ru, en. Channels in these languages come
      first once the profile's limit is reached (along with home-country channels and
      favourites). Empty: the language from the first option.
  timezone:
    name: Time zone
    description: >-
      For the TV guide and the nightly job schedule, e.g. Europe/Berlin. Empty: Home
      Assistant's time zone.
  github_token:
    name: GitHub token
    description: >-
      Optional. Any token with no permissions (GitHub → Settings → Developer settings →
      Personal access tokens). With it the playlist search also searches code on GitHub
      and finds more. Without it only repositories are searched.
