configuration:
  language:
    name: Язык уведомлений и скриптов
    description: >-
      Уведомления в Home Assistant, события и сводки на сайте, названия и голосовые фразы
      скриптов от кнопки «Создать в Home Assistant». Язык самого сайта выбирается в
      браузере: сайт → «Настройки» → «Язык интерфейса».
  profile:
    name: Профиль данных
    description: >-
      Сколько потоков брать из найденных плейлистов. S: до 6 000, хватает сервера
      с 4 ГБ (HA Green). M: до 15 000, Raspberry Pi 5 или мини-ПК. L: до 30 000 и 8
      проверок одновременно вместо 4, только мини-ПК. Ваши собственные плейлисты в лимит
      не входят.
  home_country:
    name: Страна дома
    description: >-
      Код страны из двух букв, например de. Каналы этой страны идут первыми при лимите
      профиля и попадают в каталог, даже если с сервера кажутся заблокированными по
      стране. Пусто: без этих поблажек.
  channel_languages:
    name: Языки каналов
    description: >-
      Коды языков через запятую, например ru, en. Каналы на этих языках идут первыми,
      когда набран лимит профиля (вместе с каналами страны дома и избранными). Пусто:
      язык из первой настройки.
  timezone:
    name: Часовой пояс
    description: >-
      Для программы передач и ночного расписания задач, например Europe/Berlin. Пусто:
      часовой пояс Home Assistant.
  github_token:
    name: Токен GitHub
    description: >-
      Необязательно. Любой токен без прав (GitHub → Settings → Developer settings →
      Personal access tokens). С ним поиск плейлистов ищет и по коду на GitHub и
      находит больше. Без него ищутся только репозитории.
