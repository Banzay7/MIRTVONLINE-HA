configuration:
  language:
    name: Язык интерфейса
    description: Язык сайта и оповещений.
  profile:
    name: Профиль данных
    description: >-
      S: одна страна и язык, работает на любом сервере с 4 ГБ (HA Green).
      M: несколько стран, нужен Raspberry Pi 5 или мини-ПК.
      L: весь мир, только мини-ПК.
  home_country:
    name: Страна дома
    description: >-
      Две буквы, например de. Каналы этой страны сохраняются, даже если отсюда они
      кажутся заблокированными. Пусто: спросит мастер первого запуска.
  timezone:
    name: Часовой пояс
    description: "Для телепрограммы, например Europe/Berlin. Пусто: часовой пояс Home Assistant."
  github_token:
    name: Токен GitHub
    description: >-
      Необязательно. Любой токен без прав; позволяет поиску плейлистов искать по коду
      на GitHub. Без него ищутся только репозитории.
